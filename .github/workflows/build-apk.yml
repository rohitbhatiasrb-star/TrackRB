
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -la
          test -f TrackRB_Polished_v1.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q TrackRB_Polished_v1.zip -d project

          echo "Extracted project files:"
          find project -maxdepth 5 -type f | head -100

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find project -type f
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Install Gradle 8.9
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Clean Android project
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.9/bin/gradle clean --no-daemon

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find generated APK
        if: success()
        run: |
          echo "Searching for APK:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
