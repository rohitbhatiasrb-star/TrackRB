
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: 8.9

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract TrackRB V9.1 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          ZIP_FILE="${GITHUB_WORKSPACE}/TrackRB_V9_1_Mandatory_History_Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/project" \
            -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/project" \
              -type f -name settings.gradle.kts -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find project -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          /tmp/gradle-${GRADLE_VERSION}/bin/gradle \
            --no-daemon clean \
            --stacktrace \
            --console=plain

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          /tmp/gradle-${GRADLE_VERSION}/bin/gradle \
            --no-daemon assembleDebug \
            --stacktrace \
            --info \
            --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-build-log
          path: build.log
          if-no-files-found: warn

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/app-debug.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated"
            find "$PROJECT_DIR" -type f \
              | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK generated at:"
          echo "$APK_FILE"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
