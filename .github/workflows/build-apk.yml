
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          set -e
          rm -rf project
          mkdir -p project

          unzip -q TrackRB_v9_Mandatory_History.zip -d project

          echo "Extracted project files:"
          find project -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "settings.gradle not found"
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Gradle 8.9
        run: |
          set -e

          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
