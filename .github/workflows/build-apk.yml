
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TrackRB v9.1 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify ZIP file
        run: |
          ZIP_FILE="TrackRB_V9_1_Mandatory_History_Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip"
            exit 1
          fi

          echo "ZIP verified: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project files:"
          find project -maxdepth 5 -type f | sort

      - name: Locate Gradle project
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          ls -la "$PROJECT_DIR"

      - name: Install Gradle 8.9
        run: |
          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Clean project
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            clean \
            --stacktrace

      - name: Build Debug APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show actual build error
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========================================"
          echo "          ACTUAL BUILD ERROR"
          echo "========================================"

          grep -n -E \
            "error:|ERROR|FAILURE|What went wrong|Execution failed|Caused by:" \
            build.log | tail -n 100 || true

          echo ""
          echo "========================================"
          echo "          LAST 200 LOG LINES"
          echo "========================================"

          tail -n 200 build.log

      - name: Upload build error log
        if: steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-v9.1-Build-Error-Log
          path: build.log
          if-no-files-found: error

      - name: Stop if build failed
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "APK build failed."
          echo "Please download the build error log."
          exit 1

      - name: Find generated APK
        if: success()
        run: |
          echo "Generated APK files:"
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "app-debug.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-v9.1-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
