
name: Build TrackRB V10 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify ZIP file
        run: |
          test -f TrackRB_V10_Mandatory_History_FIXED.zip
          unzip -t TrackRB_V10_Mandatory_History_FIXED.zip

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q TrackRB_V10_Mandatory_History_FIXED.zip -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle \
            -type f \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Install Gradle 8.9
        run: |
          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Clean project
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            clean \
            --no-daemon

      - name: Build Debug APK
        run: |
          set +e

          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build-error.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "Gradle exit code: $BUILD_STATUS"

          exit $BUILD_STATUS

      - name: Upload build error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-V10-Build-Logs
          path: build-error.log
          if-no-files-found: ignore

      - name: Find generated APK
        if: success()
        run: |
          echo "Searching for APK..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-V10-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
