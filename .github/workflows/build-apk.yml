
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          ls -la
          test -f TrackRB_v9_Mandatory_History.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project

          unzip -q TrackRB_v9_Mandatory_History.zip -d project

          echo "Extracted files:"
          find project -maxdepth 5 -type f

      - name: Locate Android project
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle \
            -type f \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Install Gradle 8.9
        run: |
          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Clean project
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find APK
        if: success()
        run: |
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-V9-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
