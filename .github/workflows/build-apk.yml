name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q TrackRB_Polished_v2_Fixed.zip -d project

          echo "Extracted project files:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Android project
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Install Gradle
        run: |
          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for APK files..."
          find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
