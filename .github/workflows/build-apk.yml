
name: Build TrackRB V12 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract TrackRB V12
        run: |
          set -e
          rm -rf project
          mkdir project

          unzip -q TrackRB_V13_Compile_Fixed_History_Final_Recipient.zip -d project

          find project -name settings.gradle -print

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Install Gradle 8.9
        run: |
          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

      - name: Clean project
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.9/bin/gradle clean --no-daemon

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.9/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-V12-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
