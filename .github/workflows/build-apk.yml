
name: Build TrackRB v10 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP file
        run: |
          echo "ZIP files available:"
          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname "*.zip" -print

      - name: Extract Android project
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project files:"
          find project -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Locate Gradle project
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Install Gradle 8.9
        run: |
          set -e

          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: Clean project
        run: |
          cd "$PROJECT_DIR"
          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            clean \
            --stacktrace

      - name: Build Debug APK
        id: build_apk
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/build-output.log"

          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$BUILD_EXIT"

          exit "$BUILD_EXIT"

      - name: Show actual build error
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "================ ACTUAL BUILD ERROR ================"

          if [ -f build-output.log ]; then
            grep -n -B 5 -A 12 \
              -E "error:|FAILURE:|What went wrong|cannot find symbol" \
              build-output.log \
              || cat build-output.log
          fi

          echo "======================================================"

      - name: Upload build error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-Build-Error-Log
          path: build-output.log
          if-no-files-found: ignore

      - name: Find generated APK
        if: steps.build_apk.outcome == 'success'
        run: |
          echo "Searching APK files:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-v10-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Stop if build failed
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "APK build failed."
          echo "Download TrackRB-Build-Error-Log artifact."
          exit 1
          
