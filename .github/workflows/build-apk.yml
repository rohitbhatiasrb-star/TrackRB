
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify ZIP
        run: |
          ls -lah
          test -f TrackRB_v9_Mandatory_History.zip

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q TrackRB_v9_Mandatory_History.zip -d project

          echo "Project files:"
          find project -maxdepth 6 -type f | sort

      - name: Locate Android project
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -name settings.gradle \
            -type f \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"

      - name: Install Gradle 8.9
        run: |
          curl -L -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version

      - name: Clean project
        run: |
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build Debug APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          /tmp/gradle-8.9/bin/gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show actual error
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "========== ACTUAL BUILD ERRORS =========="
          grep -i -E \
            "error:|FAILURE:|What went wrong|Could not|Compilation failed" \
            build.log | tail -80 || true

          echo "========== LAST 150 LOG LINES =========="
          tail -150 build.log

      - name: Upload build error log
        if: steps.build_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-Build-Error-Log
          path: build.log

      - name: Stop if build failed
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "APK build failed. Download the error log."
          exit 1

      - name: Find APK
        run: |
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-V9-APK
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
