name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Check ZIP file
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -la

          ZIP_FILE="$GITHUB_WORKSPACE/TrackRB_Polished_v3_Tabular_Search_Capital.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: ZIP FILE NOT FOUND"
            echo "Expected:"
            echo "$ZIP_FILE"
            echo ""
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"


      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/TrackRB_Polished_v3_Tabular_Search_Capital.zip"

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo ""
          echo "EXTRACTED FILES:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f | head -200


      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle NOT FOUND"
            echo ""
            echo "Project contents:"
            find "$GITHUB_WORKSPACE/project" -maxdepth 8 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Show Android project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app


      - name: Install Gradle
        shell: bash
        run: |
          set -e

          curl -L \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          rm -rf /tmp/gradle-8.9

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version


      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo ""
          echo "BUILDING ANDROID APK"
          echo "Directory:"
          pwd

          echo ""

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            assembleDebug \
            --stacktrace \
            --info


      - name: Find APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "SEARCHING FOR APK..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackRB-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
